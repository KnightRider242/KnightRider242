name: Refresh contribution card

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-cards.yml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Update contribution card
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: KnightRider242
          cards: contributions
          output-dir: assets
          themes: light,dark
          palette: blue
          commit: true
          commit-message: "chore(profile): refresh contributions [skip ci]"
